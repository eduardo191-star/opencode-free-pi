name: Publish npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (false = only build and test)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Version and publish
        if: github.event_name == 'push' || inputs.publish != false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "$NAME@$CURRENT" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VERSION"
          npm publish --access public

          if ! git diff --quiet -- package.json package-lock.json dist; then
            git add package.json package-lock.json dist
            git commit -m "chore(release): v$VERSION [skip ci]"
          fi

          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
          fi

          git push origin HEAD:main
          git push origin "v$VERSION"

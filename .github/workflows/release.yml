name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and create a GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check package contents
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: npm pack --dry-run
      - name: Publish and release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "$NAME@$CURRENT" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          TARBALL=$(npm pack --silent | tail -n1)
          echo "Publishing $NAME@$VERSION"
          npm publish "$TARBALL" --access public

          git add package.json package-lock.json dist
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$VERSION [skip ci]"
          fi

          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
          fi

          git push origin HEAD:main
          git push origin "v$VERSION"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$TARBALL" --clobber
          else
            gh release create "v$VERSION" "$TARBALL" --title "v$VERSION" --generate-notes
          fi
